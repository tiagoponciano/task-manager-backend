version: '3.8'

services:
  db:
    image: postgres:16
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: task_management
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: task-manager-backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://admin:admin@db:5432/task_management?schema=public
      PORT: 3001
    ports:
      - "3001:3001"

volumes:
  postgres_data: